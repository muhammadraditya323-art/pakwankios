<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kios Pak Wan - Cek harga &amp; stok, Prambon Nganjuk</title>
<meta name="description" content="Cek harga dan stok Kios Pak Wan di Prambon, Nganjuk dari rumah. Pesan lewat WhatsApp.">
<meta name="theme-color" content="#14532D">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kios Pak Wan">

<meta property="og:description" content="Cek harga dan stok dari rumah, lalu pesan lewat WhatsApp. Prambon, Nganjuk.">
<meta property="og:url" content="https://muhammadraditya323-art.github.io/PakWan/">
<meta property="og:image" content="https://muhammadraditya323-art.github.io/PakWan/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://muhammadraditya323-art.github.io/PakWan/og-image.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pak Wan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A22; --paper:#FFFFFF; --card:#FFFFFF; color-scheme:light;
    --green:#1F7A3E; --green-deep:#14532D; --green-soft:#EAF4EC;
    --gold:#F2B200; --gold-soft:#F7CB45;
    --red:#7C2233; --red-deep:#551824;
    --line: rgba(27,42,34,0.14);
    box-sizing:border-box;
  }
  *{box-sizing:inherit;}
  html,body{height:100%;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Public Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  img{max-width:100%; display:block;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }

  .hero{ background:linear-gradient(160deg, var(--red) 0%, var(--red-deep) 100%); color:#F7ECD8; padding:34px 20px 32px; }
  .hero-inner{max-width:640px; margin:0 auto;}
  .hero .tagline{margin:0 0 8px; font-size:0.95rem; font-style:italic; color:var(--gold-soft);}
  .hero h1{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(2.1rem,7vw,2.9rem); margin:0; letter-spacing:-0.01em; color:#FBF3E2; }
  .ribbon{height:9px; display:flex;}
  .ribbon span{flex:1;}
  .ribbon .r{background:var(--red);} .ribbon .g{background:var(--gold);} .ribbon .e{background:var(--green);}

  .admin-banner{ max-width:640px; margin:0 auto; padding:12px 20px; font-size:0.8rem; color:var(--ink); opacity:0.85; text-align:center; border-bottom:1px dashed var(--line); }
  .admin-banner b{display:block; margin-bottom:6px; color:var(--red);}
  .admin-banner .dl-btn{ margin-top:8px; display:inline-block; background:var(--green); color:var(--gold-soft); border:0; border-radius:8px; padding:9px 16px; font:600 0.82rem 'Public Sans',sans-serif; cursor:pointer; }

  .toolbar{ max-width:640px; margin:0 auto; padding:14px 20px 0; display:flex; gap:8px; flex-wrap:wrap; }
  .toolbar input[type="search"]{ flex:1 1 160px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font:400 0.9rem 'Public Sans',sans-serif; }
  .toolbar select{ flex:0 0 auto; padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font:500 0.85rem 'Public Sans',sans-serif; }
  .cat-heading{ grid-column:1/-1; font:600 1.05rem 'Fraunces',serif; color:var(--red); margin:14px 0 -4px; padding-top:10px; border-top:1px dashed var(--line); }
  .cat-heading:first-child{ border-top:0; margin-top:0; padding-top:0; }

  .new-badge{ position:absolute; top:9px; right:9px; background:var(--green); color:var(--gold-soft); font:700 0.66rem 'Public Sans',sans-serif; padding:3px 8px; border-radius:999px; }

  .fab-calc{ background:var(--gold); color:#2A1B08; }

  .qty-row{ display:flex; align-items:center; justify-content:center; gap:12px; padding:8px 0; border-top:1px solid var(--line); }
  .qty-btn{ width:28px; height:28px; border-radius:999px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font:700 1rem 'Public Sans',sans-serif; cursor:pointer; line-height:1; }
  .qty-num{ min-width:20px; text-align:center; font:600 0.95rem 'Public Sans',sans-serif; }

  .cart-bar{ position:fixed; left:0; right:0; bottom:0; z-index:15; background:var(--card); border-top:1px solid var(--line); box-shadow:0 -4px 14px rgba(0,0,0,0.15); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); }
  .cart-bar-row{ display:flex; align-items:center; gap:10px; max-width:640px; margin:0 auto; flex-wrap:wrap; }
  .cart-bar .cart-info{ flex:1 1 auto; font-size:0.85rem; }
  .cart-bar .cart-total{ font:700 1rem 'Fraunces',serif; color:var(--red); }
  .cart-bar input[type="number"]{ width:100px; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); font:400 0.85rem 'Public Sans',sans-serif; }
  .cart-bar .cart-kembali{ font-size:0.78rem; opacity:0.75; }
  .cart-bar button.pesan-btn{ background:var(--green); color:var(--gold-soft); border:0; border-radius:999px; padding:10px 18px; font:700 0.88rem 'Public Sans',sans-serif; cursor:pointer; }
  .calc-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .calc-row .calc-name{ flex:1; font-size:0.88rem; }
  .calc-row .calc-price{ font-size:0.76rem; opacity:0.6; }
  .calc-row input[type="number"]{ width:56px; padding:7px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); text-align:center; }
  .calc-summary{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); font-size:0.9rem; }
  .calc-summary .calc-line{ display:flex; justify-content:space-between; padding:4px 0; }
  .calc-summary .calc-total{ font-weight:700; font-size:1.05rem; }
  .calc-summary .calc-kembali.negatif{ color:var(--red); font-weight:700; }
  .calc-summary .calc-kembali.positif{ color:var(--green); font-weight:700; }

  .chips{display:flex; gap:8px; padding:16px 20px; overflow-x:auto; max-width:640px; margin:0 auto; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:500 0.88rem 'Public Sans',sans-serif; cursor:pointer;}
  .chip.active{background:var(--green); color:var(--gold-soft); border-color:var(--green);}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; padding:4px 20px 60px; max-width:640px; margin:0 auto;}
  @media(min-width:560px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media(min-width:860px){ .grid{grid-template-columns:repeat(4,1fr); max-width:960px;} }

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column;}
  .thumb{position:relative; aspect-ratio:1/1; background:#EFE7D6; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .thumb svg{width:38%; height:38%; opacity:0.35;}
  .price-tag{ position:absolute; top:9px; left:-6px; background:var(--gold); color:#2A1B08; font:700 0.76rem 'Public Sans',sans-serif; padding:4px 10px 4px 14px; border-radius:0 6px 6px 0; transform:rotate(-4deg); box-shadow:1px 2px 0 rgba(0,0,0,0.12); }
  .info{padding:10px 12px 12px; flex:1; display:flex; flex-direction:column; gap:4px;}
  .info h3{margin:0; font:600 1rem 'Fraunces',serif; line-height:1.25;}
  .info p{margin:0; font-size:0.8rem; opacity:0.75; line-height:1.35;}
  .cat{font-size:0.7rem; opacity:0.55; margin-top:auto; padding-top:4px;}
  .admin-row{display:flex; border-top:1px solid var(--line);}
  .admin-row button{flex:1; border:0; background:none; padding:9px; font:500 0.78rem 'Public Sans',sans-serif; cursor:pointer;}
  .admin-row .edit{color:var(--green); border-right:1px solid var(--line);}
  .admin-row .del{color:var(--red);}

  .empty{grid-column:1/-1; text-align:center; padding:48px 20px; opacity:0.7; font-size:0.95rem;}

  .fabs{position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:10px; z-index:5;}
  .fab{border:0; border-radius:999px; padding:12px 18px; font:600 0.88rem 'Public Sans',sans-serif; box-shadow:0 4px 14px rgba(0,0,0,0.2); cursor:pointer;}
  .fab-qris{background:var(--green); color:var(--gold-soft);}
  .fab-add{background:var(--red); color:#FBF3E2;}

  .foot{max-width:640px; margin:0 auto; padding:10px 20px 30px; font-size:0.76rem; opacity:0.55; text-align:center;}

  .overlay{position:fixed; inset:0; background:rgba(18,14,9,0.52); display:flex; align-items:flex-end; justify-content:center; z-index:20;}
  @media(min-width:560px){ .overlay{align-items:center;} }
  .sheet{background:var(--card); color:var(--ink); width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:22px 20px; max-height:88vh; overflow-y:auto;}
  @media(min-width:560px){ .sheet{border-radius:18px;} }
  .sheet h2{font:600 1.3rem 'Fraunces',serif; margin:0 0 14px;}
  .sheet label{display:block; font-size:0.82rem; margin-bottom:13px;}
  .sheet input, .sheet select, .sheet textarea{display:block; width:100%; margin-top:5px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); font:400 0.95rem 'Public Sans',sans-serif;}
  .sheet textarea{min-height:60px; resize:vertical;}
  .sheet .hint{font-size:0.85rem; opacity:0.75; text-align:center; margin:0 0 4px;}
  .preview{margin:6px 0 14px; text-align:center;}
  .preview img{max-width:100%; max-height:220px; border-radius:10px; margin:0 auto;}
  .preview span{font-size:0.82rem; opacity:0.55;}
  .sheet-actions{display:flex; gap:10px; margin-top:8px;}
  .sheet-actions button{flex:1; padding:11px; border-radius:10px; border:0; font:600 0.88rem 'Public Sans',sans-serif; cursor:pointer;}
  .sheet-actions .ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .sheet-actions .primary{background:var(--green); color:var(--gold-soft);}
  .sheet-actions .primary:disabled{opacity:0.5;}
  .sheet-actions .danger{background:transparent; border:1px solid var(--red); color:var(--red);}

  /* --- Lokasi & jam buka --- */
  .info-card{ max-width:640px; margin:16px auto 0; padding:0 20px; }
  .info-inner{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .status{ display:inline-flex; align-items:center; gap:8px; font:600 0.9rem 'Public Sans',sans-serif; }
  .status .dot{ width:10px; height:10px; border-radius:50%; background:#999; }
  .status.open{ color:var(--green); } .status.open .dot{ background:#2E9E6B; box-shadow:0 0 0 3px rgba(46,158,107,0.2); }
  .status.closed{ color:var(--red); } .status.closed .dot{ background:var(--red); }
  .info-row{ display:flex; gap:10px; font-size:0.88rem; line-height:1.4; }
  .info-row .ico{ flex:none; }
  .info-row small{ opacity:0.6; }
  .hours summary{ cursor:pointer; font-size:0.85rem; color:var(--green); font-weight:600; }
  .hours ul{ list-style:none; margin:8px 0 0; padding:0; font-size:0.85rem; }
  .hours li{ display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed var(--line); }
  .hours li.today{ font-weight:700; color:var(--red); }
  .map-btn{ align-self:flex-start; background:var(--green); color:var(--gold-soft); text-decoration:none; border-radius:999px; padding:9px 16px; font:600 0.85rem 'Public Sans',sans-serif; }

  /* --- Stok baru & terlaris --- */
  .badges{ position:absolute; top:9px; right:9px; display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
  .badges .new-badge, .badges .best-badge{ position:static; }
  .best-badge{ background:var(--red); color:#FBF3E2; font:700 0.66rem 'Public Sans',sans-serif; padding:3px 8px; border-radius:999px; }
  .strip-sec{ max-width:640px; margin:0 auto; padding:0 0 6px; }
  .strip-sec h2{ font:600 1.05rem 'Fraunces',serif; color:var(--red); margin:6px 20px 10px; }
  .strip{ display:flex; gap:12px; overflow-x:auto; padding:2px 20px 10px; scrollbar-width:thin; }
  .strip .card{ flex:0 0 150px; }
  @media(min-width:860px){ .strip-sec{ max-width:960px; } }

  /* --- Tombol beli & keranjang --- */
  .buy-btn{ width:100%; border:0; border-radius:10px; background:var(--green); color:var(--gold-soft); padding:9px; font:700 0.85rem 'Public Sans',sans-serif; cursor:pointer; }
  .buy-btn:active{ transform:scale(0.98); }
  .qty-row{ padding:8px 10px; }
  .qty-btn{ width:34px; height:34px; }
  .cart-bar .clear-btn{ background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:8px 12px; font:500 0.78rem 'Public Sans',sans-serif; cursor:pointer; }
  .sheet label.check{ display:flex; align-items:center; gap:8px; }
  .sheet label.check input{ display:inline-block; width:auto; margin:0; }

  /* --- Stok habis, offline, coba lagi --- */
  .card.soldout .thumb img{ filter:grayscale(1); opacity:0.55; }
  .soldout-mask{ position:absolute; inset:auto 0 0 0; background:rgba(36,26,18,0.78); color:#FBF3E2; text-align:center; font:700 0.78rem 'Public Sans',sans-serif; letter-spacing:0.08em; padding:6px 0; }
  .soldout-note{ font:600 0.82rem 'Public Sans',sans-serif; opacity:0.6; padding:7px 0; }
  .offline-note{ max-width:600px; margin:12px auto 0; padding:8px 12px; font-size:0.8rem; background:rgba(198,154,62,0.18); border:1px solid var(--gold); border-radius:10px; }
  .retry-btn{ margin-top:12px; border:0; border-radius:999px; background:var(--green); color:var(--gold-soft); padding:9px 18px; font:600 0.85rem 'Public Sans',sans-serif; cursor:pointer; }

  /* --- Scan barcode pelanggan --- */
  .scan-view{ position:fixed; inset:0; background:#000; z-index:40; display:flex; flex-direction:column; }
  .scan-view video{ flex:1; width:100%; object-fit:cover; min-height:0; }
  .scan-frame{ position:absolute; left:10%; right:10%; top:20%; height:24%; border:3px solid var(--gold-soft); border-radius:14px; box-shadow:0 0 0 9999px rgba(0,0,0,0.4); pointer-events:none; }
  .scan-bottom{ background:var(--card); color:var(--ink); padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)); }
  .sc-result{ font-size:0.92rem; font-weight:600; text-align:center; padding:10px; border-radius:10px; background:var(--paper); margin-bottom:8px; }
  .sc-result.ok{ background:rgba(46,158,107,0.18); color:var(--green); }
  .sc-result.bad{ background:rgba(124,34,51,0.15); color:var(--red); }
  .sc-result.info{ background:rgba(198,154,62,0.2); }
  .sc-total{ text-align:center; font:700 0.95rem 'Fraunces',serif; margin-bottom:10px; }
  .sc-manual{ display:flex; gap:8px; margin-bottom:10px; }
  .sc-manual input{ flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); font:400 1rem 'Public Sans',sans-serif; }
  .sc-manual button, .sc-done{ border:0; border-radius:10px; background:var(--green); color:var(--gold-soft); padding:10px 16px; font:700 0.9rem 'Public Sans',sans-serif; cursor:pointer; }
  .sc-done{ width:100%; }
  .sheet .code-label{ display:block; font-size:0.82rem; margin:10px 0 6px; }
  .sheet .code-label input{ display:block; width:100%; margin-top:5px; padding:11px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); font:400 1rem 'Public Sans',sans-serif; letter-spacing:0.15em; }
  .code-err{ color:var(--red); font-size:0.82rem; min-height:1.1em; margin-bottom:6px; }
  .wa-open{ flex:1; display:block; text-align:center; background:var(--green); color:var(--gold-soft); text-decoration:none; border-radius:10px; padding:12px; font:700 0.92rem 'Public Sans',sans-serif; }
  .noorder-note{ font-size:0.68rem; opacity:0.6; text-align:center; padding:0 6px 8px; }
  .rokok-flag{ font-size:0.68rem; opacity:0.7; color:var(--red); }
  .pay-title{ font:600 0.85rem 'Public Sans',sans-serif; margin:10px 0 6px; }
  .qris-box{ text-align:center; margin:10px 0; }
  .qris-box img{ max-width:240px; width:100%; margin:8px auto 0; border-radius:10px; background:#fff; padding:6px; }

  /* ===== TAMPILAN TOKO (hijau, latar putih) ===== */
  html{ background:#fff; }
  body{ background:#fff; }
  .ic{ width:1.15em; height:1.15em; flex:none; vertical-align:-0.2em; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 14px; }
  .topbar{ background:var(--green-deep); color:#DCEBE3; font-size:0.74rem; }
  .topbar .wrap{ display:flex; justify-content:space-between; gap:12px; padding-top:6px; padding-bottom:6px; }
  .topbar .wrap span{ display:inline-flex; align-items:center; gap:6px; }
  .topbar .tb-r{ opacity:0.85; text-align:right; }
  @media(max-width:520px){ .topbar .tb-r{ display:none; } }

  .site-head{ position:sticky; top:0; z-index:12; background:#fff; border-bottom:1px solid var(--line); }
  .head-row{ display:flex; align-items:center; gap:12px; padding-top:9px; padding-bottom:9px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--ink); flex:0 0 auto; }
  .brand-mark{ width:36px; height:36px; border-radius:9px; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font:700 1.2rem 'Fraunces',serif; }
  .brand-name{ font:700 1.25rem 'Fraunces',serif; letter-spacing:-0.01em; color:var(--green); }
  .search{ position:relative; flex:1 1 260px; order:3; }
  .search .ic{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--green); width:1.1rem; height:1.1rem; pointer-events:none; }
  .search input{ width:100%; padding:10px 14px 10px 38px; border:1.5px solid var(--green); border-radius:999px; background:#fff; color:var(--ink); font:400 0.9rem 'Public Sans',sans-serif; }
  .hd-cart{ margin-left:auto; order:2; display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:7px 14px; cursor:pointer; font-family:inherit; }
  .hd-cart.on{ background:var(--green); color:#fff; border-color:var(--green); }
  .hc-txt{ display:flex; flex-direction:column; text-align:left; line-height:1.15; font-size:0.8rem; }
  .hc-txt small{ opacity:0.8; font-size:0.72rem; }
  @media(min-width:720px){ .search{ order:2; } .hd-cart{ order:3; margin-left:0; } }

  .mainnav{ background:var(--green); }
  .mainnav .wrap{ display:flex; gap:2px; }
  .nav-item{ display:inline-flex; align-items:center; gap:7px; padding:11px 14px; color:#E6F3EC; text-decoration:none; background:transparent; border:0; border-bottom:3px solid transparent; font:600 0.86rem 'Public Sans',sans-serif; cursor:pointer; }
  .nav-item.on{ color:#fff; border-bottom-color:var(--gold-soft); background:rgba(255,255,255,0.1); }
  .nav-item:hover{ background:rgba(255,255,255,0.14); }

  .pickers{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; position:relative; z-index:8; }
  .panel{ position:relative; min-width:0; }
  .pk-btn{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; background:#fff; border:1.5px solid var(--green); border-radius:12px; padding:9px 12px; cursor:pointer; font-family:inherit; color:var(--ink); }
  .panel.open .pk-btn{ background:var(--green); color:#fff; border-radius:12px 12px 0 0; }
  .pk-t{ display:flex; flex-direction:column; min-width:0; line-height:1.2; }
  .pk-l{ font:700 0.68rem 'Public Sans',sans-serif; letter-spacing:0.08em; text-transform:uppercase; opacity:0.75; }
  .pk-v{ font:600 0.88rem 'Public Sans',sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pk-ic{ width:20px; height:20px; transition:transform .2s; }
  .panel.open .pk-ic{ transform:rotate(180deg); }
  .plist{ position:absolute; left:0; right:0; top:100%; display:flex; flex-direction:column; max-height:244px; overflow-y:auto; overflow-x:hidden; background:#fff; border:1.5px solid var(--green); border-top:0; border-radius:0 0 12px 12px; box-shadow:0 12px 24px rgba(14,59,45,0.18); padding:0; margin:0; max-width:none; gap:0; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  .panel.right .plist{ left:auto; right:0; width:max(100%, min(270px, 92vw)); }

  .dlg-act{ display:flex; gap:10px; }
  .dlg-act button{ flex:1; border-radius:10px; padding:11px; font:600 0.9rem 'Public Sans',sans-serif; cursor:pointer; border:1px solid rgba(27,42,34,0.2); background:#fff; color:#1B2A22; }
  .dlg-act .dlg-ok{ background:#1F7A3E; color:#fff; border-color:#1F7A3E; }
  .dlg-act .dlg-ok.danger{ background:#B3261E; border-color:#B3261E; }
</style>

<body>
<script type="application/json" id="state-data">{"shopName": "Kios Pak Wan", "tagline": "Cek dulu ada apa aja hari ini", "categories": ["Rokok", "Makanan & Minuman", "Kebutuhan Pokok", "Lainnya"], "info": {"address": "Jl. Warujayeng - Kediri, Sanggrahan, Kec. Prambon, Kabupaten Nganjuk, Jawa Timur 64484", "plusCode": "72RC+QQM", "mapsUrl": "https://maps.app.goo.gl/dnFZb5Tg37p73rcM7", "hours": [{"o": 780, "c": 1440}, {"o": 780, "c": 1440}, {"o": 780, "c": 1440}, {"o": 780, "c": 1440}, {"o": 780, "c": 1440}, {"o": 780, "c": 1440}, {"o": 780, "c": 1560}]}}</script>

<div id="app"></div>

<script>
(function(){
  /* ====== PENGATURAN ====== */
  var SUPABASE_URL = 'https://mustqabprbxnhgcfvonw.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_mXwg2cPa7-krAPUnLtxyKw_HSZyZhbQ'; // kunci publik (hanya bisa membaca)
  var CACHE_KEY = 'kiosPakWan.products.v3';
  var SLIDE_MS = 5000; // slide banner berganti tiap 5 detik

  var STATE = JSON.parse(document.getElementById('state-data').textContent || '{}');
  STATE.products = [];
  STATE.qris = null;

  var DAY_NAMES = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  var activeCat = 'Semua';
  var searchQuery = '';
  var sortMode = 'kategori';
  var cart = {};        // { productId: qty }
  var bayarState = '';  // uang dibayar (dipakai bersama bar keranjang & kalkulator)
  var loadStatus = 'loading'; // loading | ok | error
  var fromCache = false;
  var view = 'home';      // home | comments | info | services
  var SERVICES = [];
  var openPanel = null;   // null | 'cat' | 'sort' (menu Kategori / Urutan yang sedang dibuka)
  var SLIDES = [], slideIdx = 0, slidePaused = false;
  var COMMENTS = null, cmStatus = 'idle', cmName = '', cmText = '', cmMsg = '', cmStars = 0, cmSummary = null;
  var ANNS = [], ABOUT = '';
  var reqItem = '', reqNote = '', reqName = '', reqMsg = '';
  var missTimer = null, missLogged = {}, PORTRAIT = {};
  var CART_KEY = 'kiosPakWan.cart.v1';

  /* ====== DATA (Supabase) ====== */
  function photoUrl(name){
    return SUPABASE_URL + '/storage/v1/object/public/foto/' + encodeURIComponent(name);
  }
  function normalize(r){
    return {
      id: String(r.id), name: r.name || '', price: r.price || 0,
      category: r.category || 'Lainnya', description: r.description || '',
      photo: r.photo ? photoUrl(r.photo) : null,
      barcode: r.barcode || null,
      noOrder: /^\s*rokok\s*$/i.test(String(r.category || '')), // rokok: hanya info harga
      isNew: r.is_new === true, best: r.is_best === true, soldOut: r.sold_out === true,
      rating: Number(r.rating_avg) || 0, ratingCount: parseInt(r.rating_count, 10) || 0
    };
  }
  function applyProducts(list){
    STATE.products = list;
    // kategori dari data, urutan awal tetap dipertahankan
    STATE.categories = (STATE.categories || []).slice();
    list.forEach(function(p){ if(STATE.categories.indexOf(p.category) === -1) STATE.categories.push(p.category); });
    // buang barang di keranjang yang sudah tidak ada / habis
    Object.keys(cart).forEach(function(id){
      var p = list.find(function(x){ return x.id === id; });
      if(!p || p.soldOut) delete cart[id];
    });
  }
  var BASE_COLS = 'id,name,price,category,description,photo,is_new,is_best,sold_out,barcode';
  function fetchProducts(cols){
    var url = SUPABASE_URL + '/rest/v1/products?select=' + cols + '&order=id.asc';
    return fetch(url, {headers: {apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY}})
      .then(function(res){ if(!res.ok){ var e = new Error('HTTP ' + res.status); e.status = res.status; throw e; } return res.json(); });
  }
  function loadProducts(){
    // coba dengan kolom rating; kalau SQL terbaru belum dijalankan (HTTP 400), pakai kolom dasar
    return fetchProducts(BASE_COLS + ',rating_avg,rating_count')
      .catch(function(e){ if(e && e.status === 400) return fetchProducts(BASE_COLS); throw e; })
      .then(function(rows){
        var list = rows.map(normalize);
        applyProducts(list);
        loadStatus = 'ok'; fromCache = false;
        try{ localStorage.setItem(CACHE_KEY, JSON.stringify(list)); }catch(e){}
      })
      .catch(function(){
        var cached = null;
        try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); }catch(e){}
        if(cached && cached.length){ applyProducts(cached); loadStatus = 'ok'; fromCache = true; }
        else { loadStatus = 'error'; }
      });
  }
  function rpc(name, body){
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method:'POST',
      headers:{apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY, 'Content-Type':'application/json'},
      body:JSON.stringify(body)
    }).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text().then(function(t){ try{ return t ? JSON.parse(t) : null; }catch(e){ return null; } }); });
  }
  function loadSlides(){
    var url = SUPABASE_URL + '/rest/v1/slides?select=id,title,subtitle,image,link&active=eq.true&order=position.asc,id.asc';
    return fetch(url, {headers: {apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY}})
      .then(function(r){ if(!r.ok) throw new Error('x'); return r.json(); })
      .then(function(rows){
        SLIDES = rows.map(function(r){ return {title:r.title || '', subtitle:r.subtitle || '', image:r.image ? photoUrl(r.image) : null, link:r.link || ''}; });
      }).catch(function(){ SLIDES = []; });
  }
  function loadServices(){
    var url = SUPABASE_URL + '/rest/v1/services?select=id,title,description&active=eq.true&order=position.asc,id.asc';
    return fetch(url, {headers: {apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY}})
      .then(function(r){ if(!r.ok) throw new Error('x'); return r.json(); })
      .then(function(rows){ SERVICES = rows; })
      .catch(function(){ SERVICES = []; });
  }
  function getJson(path){
    return fetch(SUPABASE_URL + '/rest/v1/' + path, {headers: {apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY}})
      .then(function(r){ if(!r.ok){ var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; } return r.json(); });
  }
  function loadComments(){
    cmStatus = 'loading';
    var base = 'comments?select=id,name,body,created_at';
    var q = '&approved=eq.true&order=id.desc&limit=60';
    return getJson(base + ',stars' + q)
      .catch(function(e){ if(e && e.status === 400) return getJson(base + q); throw e; })
      .then(function(rows){ COMMENTS = rows; cmStatus = 'ok'; })
      .catch(function(){ COMMENTS = []; cmStatus = 'error'; })
      .then(function(){ return rpc('comment_summary', {}).then(function(r){ cmSummary = (r && r.count) ? r : null; }).catch(function(){ cmSummary = null; }); });
  }
  function loadInfo(){
    var a = getJson('announcements?select=id,title,body,pinned,created_at&active=eq.true&order=pinned.desc,id.desc&limit=20')
      .then(function(rows){ ANNS = rows; }).catch(function(){ ANNS = []; });
    var b = getJson('site_content?select=key,value&key=eq.about')
      .then(function(rows){ ABOUT = (rows && rows[0] && rows[0].value) || ''; }).catch(function(){ ABOUT = ''; });
    return Promise.all([a, b]);
  }
  function loadCart(){
    try{
      var sv = JSON.parse(localStorage.getItem(CART_KEY) || 'null');
      if(sv && sv.cart){
        Object.keys(sv.cart).forEach(function(id){ var q = parseInt(sv.cart[id], 10); if(q > 0) cart[id] = Math.min(q, 999); });
        bayarState = sv.bayar ? String(sv.bayar) : '';
      }
    }catch(e){}
  }
  function saveCart(){
    try{
      if(cartCount() > 0) localStorage.setItem(CART_KEY, JSON.stringify({cart:cart, bayar:bayarState}));
      else localStorage.removeItem(CART_KEY);
    }catch(e){}
  }
  function deviceId(){
    try{
      var d = localStorage.getItem('kiosPakWan.device');
      if(!d){
        d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('d' + Math.random().toString(36).slice(2) + Date.now().toString(36));
        localStorage.setItem('kiosPakWan.device', d);
      }
      return d;
    }catch(e){ return 'anon-' + Math.random().toString(36).slice(2, 12); }
  }
  function checkQris(){
    var u = photoUrl('qris.png') + '?v=' + Math.floor(Date.now() / 600000);
    return fetch(u, {method:'HEAD'}).then(function(r){ if(r.ok) STATE.qris = u; }).catch(function(){});
  }

  /* ====== KERANJANG ====== */
  function cartCount(){ var n = 0; for(var id in cart){ n += cart[id]; } return n; }
  function cartTotal(){
    var total = 0;
    for(var id in cart){
      var p = STATE.products.find(function(x){ return x.id === id; });
      if(p) total += (p.price||0) * cart[id];
    }
    return total;
  }
  function setQty(id, qty){
    qty = Math.max(0, Math.min(999, parseInt(qty,10) || 0));
    var p = STATE.products.find(function(x){ return x.id === id; });
    if(!p || p.soldOut) qty = 0;
    if(qty <= 0) delete cart[id]; else cart[id] = qty;
  }
  function cartHasRokok(){
    for(var id in cart){ var p = STATE.products.find(function(x){ return x.id === id; }); if(p && p.noOrder) return true; }
    return false;
  }
  function kembaliText(){
    var bayar = parseInt(bayarState || '0', 10) || 0;
    if(bayar <= 0) return '';
    var k = bayar - cartTotal();
    return k < 0 ? 'Kurang ' + formatRupiah(Math.abs(k)) : 'Kembalian: ' + formatRupiah(k);
  }
  function generateOrderCode(){
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', code = '';
    for(var i=0;i<5;i++){ code += chars[Math.floor(Math.random()*chars.length)]; }
    return code;
  }

  /* ====== UTIL ====== */

  function askConfirm(msg, onYes, label, danger){
    var ov = document.createElement('div'); ov.className = 'dlg-ov';
    ov.innerHTML = '<div class="dlg" role="alertdialog" aria-modal="true"><p id="dlg-msg"></p><div class="dlg-act"><button type="button" id="dlg-no">Batal</button><button type="button" class="dlg-ok' + (danger ? ' danger' : '') + '" id="dlg-yes"></button></div></div>';
    ov.querySelector('#dlg-msg').textContent = msg;
    ov.querySelector('#dlg-yes').textContent = label || 'Ya';
    document.body.appendChild(ov);
    function close(){ if(ov.parentNode) ov.parentNode.removeChild(ov); }
    ov.querySelector('#dlg-no').onclick = close;
    ov.querySelector('#dlg-yes').onclick = function(){ close(); onYes(); };
    ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
    ov.querySelector('#dlg-no').focus();
  }
  function showNote(msg){
    var ov = document.createElement('div'); ov.className = 'dlg-ov';
    ov.innerHTML = '<div class="dlg" role="alertdialog" aria-modal="true"><p id="dlg-msg"></p><div class="dlg-act"><button type="button" class="dlg-ok" id="dlg-yes">Mengerti</button></div></div>';
    ov.querySelector('#dlg-msg').textContent = msg;
    document.body.appendChild(ov);
    ov.querySelector('#dlg-yes').onclick = function(){ ov.remove(); };
    ov.addEventListener('click', function(e){ if(e.target === ov) ov.remove(); });
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var ICONS = {
    search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    cart:'<path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 8H6"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
    scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/>',
    calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',
    pin:'<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    flame:'<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.2 1 2 2 2 0-3-1-5 1-8Z"/>',
    qr:'<rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 14h2v6h-4M14 18h2"/>',
    home:'<path d="M4 11l8-7 8 7M6 10v10h12V10"/>',
    chat:'<path d="M4 5h16v11H9l-5 4V5Z"/>',
    user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/>',
    left:'<path d="m15 5-7 7 7 7"/>',
    right:'<path d="m9 5 7 7-7 7"/>',
    bag:'<path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    down:'<path d="m6 9 6 6 6-6"/>',
    check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    megaphone:'<path d="M4 10v4h3l7 4V6L7 10H4Z"/><path d="M17.5 9a4 4 0 0 1 0 6"/>',
    help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',
    box:'<path d="M4 8l8-4 8 4v8l-8 4-8-4V8Z"/><path d="M4 8l8 4 8-4M12 12v8"/>',
    service:'<path d="M14.5 6.5a4 4 0 0 0-5 5L4 17l3 3 5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5 2.5-2.5Z"/>'
  };
  function ic(name, cls){
    return '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
  }
  function starSvg(filled){
    return '<svg class="star' + (filled ? ' on' : '') + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9L12 3.5Z"/></svg>';
  }
  function starsHtml(avg){
    var n = Math.round(avg), h = '';
    for(var i = 1; i <= 5; i++) h += starSvg(i <= n);
    return '<span class="stars">' + h + '</span>';
  }
  function formatRupiah(n){ return 'Rp ' + Number(n||0).toLocaleString('id-ID'); }
  function placeholderIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>';
  }

  /* ====== JAM BUKA ====== */
  function jakartaNow(){
    var parts = new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jakarta', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false}).formatToParts(new Date());
    var o = {};
    parts.forEach(function(p){ o[p.type] = p.value; });
    var map = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
    return {day: map[o.weekday], min: (parseInt(o.hour,10)%24)*60 + parseInt(o.minute,10)};
  }
  function fmtTime(min){
    return String(Math.floor(min/60) % 24).padStart(2,'0') + '.' + String(min % 60).padStart(2,'0');
  }
  function openStatus(){
    var H = STATE.info.hours, n = jakartaNow();
    var t = H[n.day], y = H[(n.day+6)%7];
    if(n.min >= t.o && n.min < t.c) return {open:true, text:'Buka sekarang · tutup pukul ' + fmtTime(t.c)};
    if(y.c > 1440 && n.min < y.c - 1440) return {open:true, text:'Buka sekarang · tutup pukul ' + fmtTime(y.c)};
    if(n.min < t.o) return {open:false, text:'Tutup · buka hari ini pukul ' + fmtTime(t.o)};
    return {open:false, text:'Tutup · buka besok pukul ' + fmtTime(H[(n.day+1)%7].o)};
  }
  function infoCard(){
    var info = STATE.info, st = openStatus(), n = jakartaNow();
    var today = info.hours[n.day];
    var rows = [1,2,3,4,5,6,0].map(function(d){
      var h = info.hours[d];
      return '<li'+(d===n.day?' class="today"':'')+'><span>'+DAY_NAMES[d]+'</span><span>'+fmtTime(h.o)+' – '+fmtTime(h.c)+'</span></li>';
    }).join('');
    return '<section class="info-strip" aria-label="Lokasi dan jam buka">' +
      '<div class="info-cell"><div class="status '+(st.open?'open':'closed')+'"><span class="dot"></span>'+escapeHtml(st.text)+'</div>' +
        '<div class="info-sub">Hari ini ('+DAY_NAMES[n.day]+'): '+fmtTime(today.o)+' – '+fmtTime(today.c)+'</div>' +
        '<details class="hours"><summary>Jam buka seminggu</summary><ul>'+rows+'</ul></details></div>' +
      '<div class="info-cell"><div class="info-row">'+ic('pin')+'<span>'+escapeHtml(info.address)+(info.plusCode?'<br><small>Kode plus: '+escapeHtml(info.plusCode)+'</small>':'')+'</span></div></div>' +
      '<div class="info-cell info-act"><a class="map-btn" href="'+escapeHtml(info.mapsUrl)+'" target="_blank" rel="noopener">Buka di Google Maps</a></div>' +
    '</section>';
  }

  /* ====== TAMPILAN ====== */
  function productCard(p){
    var qty = cart[p.id] || 0;
    var badges = (p.isNew ? '<span class="new-badge">Baru</span>' : '') +
                 (p.best ? '<span class="best-badge">Terlaris</span>' : '');
    var action;
    if(p.soldOut) action = '<div class="qty-row"><span class="soldout-note">Stok habis</span></div>';
    else if(qty > 0) action =
      '<div class="qty-row">' +
        '<button class="qty-btn" data-action="qty-minus" data-id="'+p.id+'" aria-label="Kurangi">−</button>' +
        '<span class="qty-num">'+qty+'</span>' +
        '<button class="qty-btn" data-action="qty-plus" data-id="'+p.id+'" aria-label="Tambah">+</button>' +
      '</div>';
    else action = '<div class="qty-row"><button class="buy-btn" data-action="buy" data-id="'+p.id+'">' + (p.noOrder ? 'Hitung' : ic('cart') + 'Keranjang') + '</button></div>';
    if(p.noOrder && !p.soldOut) action += '<div class="noorder-note">Hanya untuk hitungan · tidak ikut pesanan</div>';
    var rate = '<button class="rate-row" data-action="rate" data-id="'+p.id+'" aria-label="Beri rating '+escapeHtml(p.name)+'">' + starsHtml(p.rating) +
      '<span class="rate-n">' + (p.ratingCount ? p.rating.toFixed(1) + ' (' + p.ratingCount + ')' : 'Beri rating') + '</span></button>';
    return '<article class="card'+(p.soldOut?' soldout':'')+'">' +
      '<div class="thumb">' +
        (p.photo ? '<img src="'+escapeHtml(p.photo)+'" alt="'+escapeHtml(p.name)+'" loading="lazy">' : placeholderIcon()) +
        (badges ? '<div class="badges">'+badges+'</div>' : '') +
        (p.soldOut ? '<div class="soldout-mask">HABIS</div>' : '') +
      '</div>' +
      '<div class="info">' +
        '<h3>'+escapeHtml(p.name)+'</h3>' +
        '<div class="price">'+formatRupiah(p.price)+'</div>' +
        (p.description ? '<p>'+escapeHtml(p.description)+'</p>' : '') +
        rate +
      '</div>' + action +
    '</article>';
  }

  function sectionRow(title, key, list, cat){
    if(!list.length) return '';
    return '<section class="strip-sec"><h2 class="sec-title"><span>'+title+'</span></h2>' +
      '<div class="strip" data-strip="'+key+'">' + list.slice(0,5).map(productCard).join('') + '</div>' +
      (list.length > 3 ? '<div class="more-row"><button class="more-btn" data-cat="'+cat+'">Lihat semua ('+list.length+')</button></div>' : '') +
      '</section>';
  }
  function highlightStrips(){
    var news = STATE.products.filter(function(p){ return p.isNew; });
    var bests = STATE.products.filter(function(p){ return p.best; });
    return sectionRow('Stok Baru', 'new', news, '__new') + '__PROMO__' + sectionRow('Terlaris', 'best', bests, '__best');
  }
  function promoTiles(){
    return '<section class="promos" aria-label="Pintasan">' +
      '<button class="promo p1" data-go="scan">'+ic('scan')+'<span><b>Scan barcode</b><small>Cek harga &amp; masukkan ke daftar belanja</small></span></button>' +
      '<button class="promo p2" data-go="calc">'+ic('calc')+'<span><b>Kalkulator belanja</b><small>Hitung total &amp; kembalian</small></span></button>' +
      '<button class="promo p3" data-go="best">'+ic('flame')+'<span><b>Barang terlaris</b><small>Yang paling sering dicari</small></span></button>' +
      (STATE.qris ? '<button class="promo p4" data-go="qris">'+ic('qr')+'<span><b>Bayar QRIS</b><small>Tampilkan kode QRIS kios</small></span></button>' : '') +
    '</section>';
  }

  /* ---- Slide banner ---- */

  function slideGo(to){

  function openRateModal(id){
    var p = STATE.products.find(function(x){ return x.id === id; });
    if(!p) return;
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = '<div class="sheet"><h2>Beri rating</h2><p class="hint">'+escapeHtml(p.name)+'</p>' +
      '<div class="rate-pick">' + [1,2,3,4,5].map(function(i){ return '<button class="rate-star" data-s="'+i+'" aria-label="'+i+' bintang">'+starSvg(false)+'</button>'; }).join('') + '</div>' +
      '<div class="code-err" id="rate-msg"></div>' +
      '<div class="sheet-actions"><button class="ghost" id="rate-close">Batal</button></div></div>';
    document.body.appendChild(overlay);
    function close(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); }
    var stars = overlay.querySelectorAll('.rate-star');
    function paint(n){ stars.forEach(function(b, i){ b.firstChild.classList.toggle('on', i < n); }); }
    stars.forEach(function(b){
      b.addEventListener('mouseenter', function(){ paint(parseInt(b.dataset.s, 10)); });
      b.addEventListener('click', function(){
        var v = parseInt(b.dataset.s, 10), msg = overlay.querySelector('#rate-msg');
        paint(v); msg.textContent = 'Mengirim…';
        rpc('rate_product', {p_product:parseInt(p.id, 10), p_stars:v, p_device:deviceId()}).then(function(res){
          if(res && res.error){ msg.textContent = res.error === 'limit' ? 'Terlalu sering memberi rating. Coba lagi nanti.' : 'Rating belum bisa dikirim.'; return; }
          p.rating = Number(res.avg) || 0; p.ratingCount = parseInt(res.count, 10) || 0;
          close(); render();
        }).catch(function(){ msg.textContent = 'Rating belum bisa dikirim. Coba lagi nanti.'; });
      });
    });
    overlay.querySelector('#rate-close').onclick = close;
    overlay.addEventListener('click', function(e){ if(e.target === overlay) close(); });
  }

  function buildProductList(){
    if(loadStatus === 'loading') return '<div class="empty">Memuat daftar barang…</div>';
    if(loadStatus === 'error') return '<div class="empty">Daftar barang belum bisa dimuat. Periksa internet Anda.<br><button class="retry-btn" id="btn-retry">Coba lagi</button></div>';

    var base = STATE.products.slice();
    if(activeCat === '__new') base = base.filter(function(p){ return p.isNew; });
    else if(activeCat === '__best') base = base.filter(function(p){ return p.best; });
    else if(activeCat !== 'Semua') base = base.filter(function(p){ return p.category === activeCat; });
    var q = searchQuery.trim().toLowerCase();
    if(q){
      base = base.filter(function(p){
        return (p.name||'').toLowerCase().indexOf(q) !== -1 || (p.description||'').toLowerCase().indexOf(q) !== -1;
      });
    }
    var html = '', any = false;
    if(sortMode === 'kategori'){
      var special = (activeCat === 'Semua' || activeCat === '__new' || activeCat === '__best');
      var cats = special ? STATE.categories : [activeCat];
      cats.forEach(function(cat){
        var items = base.filter(function(p){ return p.category === cat; });
        if(!items.length) return;
        any = true;
        items.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'', 'id'); });
        html += '<div class="cat-heading">'+escapeHtml(cat)+'</div>';
        items.forEach(function(p){ html += productCard(p); });
      });
    } else {
      var items2 = base.slice();
      if(sortMode === 'az') items2.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'', 'id'); });
      else if(sortMode === 'za') items2.sort(function(a,b){ return (b.name||'').localeCompare(a.name||'', 'id'); });
      else if(sortMode === 'murah') items2.sort(function(a,b){ return (a.price||0) - (b.price||0); });
      else if(sortMode === 'mahal') items2.sort(function(a,b){ return (b.price||0) - (a.price||0); });
      else if(sortMode === 'rating' || sortMode === 'rating_asc'){
        var dir = sortMode === 'rating' ? -1 : 1;
        items2.sort(function(a,b){
          var ua = a.ratingCount === 0, ub = b.ratingCount === 0;
          if(ua !== ub) return ua ? 1 : -1;          // barang tanpa rating selalu di bawah
          return (dir * (a.rating - b.rating)) || (b.ratingCount - a.ratingCount) || (a.name||'').localeCompare(b.name||'', 'id');
        });
      }
      if(items2.length){ any = true; items2.forEach(function(p){ html += productCard(p); }); }
    }
    if(!any){
      var msg;
      if(q) msg = 'Tidak ada barang yang cocok dengan pencarian "'+escapeHtml(searchQuery)+'".' + (q.length >= 2 ? '<br><button class="retry-btn" data-go="request">Minta kios menyediakan barang ini</button>' : '');
      else if(activeCat === '__new') msg = 'Belum ada stok baru saat ini.';
      else if(activeCat === '__best') msg = 'Belum ada barang terlaris yang ditandai.';
      else msg = 'Belum ada barang di kategori ini.';
      html = '<div class="empty">' + msg + '</div>';
    }
    return html;
  }

  function attachHandlers(){
    document.querySelectorAll('.chip[data-cat]').forEach(function(btn){
      btn.onclick = function(){ activeCat = btn.dataset.cat; openPanel = null; render(); };
    });
    var qrisBtn = document.getElementById('btn-qris');
    if(qrisBtn) qrisBtn.onclick = openQrisModal;
    var calcBtn = document.getElementById('btn-calc');
    if(calcBtn) calcBtn.onclick = openCalcModal;
    var scanBtn = document.getElementById('btn-scan');
    if(scanBtn) scanBtn.onclick = openScanner;
    document.querySelectorAll('[data-go]').forEach(function(b){
      b.onclick = function(){
        var g = b.dataset.go;
        if(g === 'scan') openScanner();
        else if(g === 'calc') openCalcModal();
        else if(g === 'qris') openQrisModal();
        else if(g === 'request'){ reqItem = searchQuery.trim().slice(0, 80); searchQuery = ''; setView('services'); }
        else if(g === 'best'){ activeCat = '__best'; render(); window.scrollTo(0, 0); }
        else if(g === 'new'){ activeCat = '__new'; render(); window.scrollTo(0, 0); }
      };
    });
    document.querySelectorAll('.more-btn').forEach(function(b){
      b.onclick = function(){ activeCat = b.dataset.cat; openPanel = null; render(); window.scrollTo(0, 0); };
    });
    document.querySelectorAll('[data-view]').forEach(function(b){
      b.onclick = function(){ setView(b.dataset.view); };
    });
    document.querySelectorAll('[data-action="rate"]').forEach(function(b){
      b.onclick = function(){ openRateModal(b.dataset.id); };
    });
    document.querySelectorAll('[data-sort]').forEach(function(b){
      b.onclick = function(){ sortMode = b.dataset.sort; openPanel = null; render(); };
    });
    document.querySelectorAll('[data-pick]').forEach(function(b){
      b.onclick = function(){ openPanel = (openPanel === b.dataset.pick) ? null : b.dataset.pick; render(); };
    });
    var sl = document.getElementById('slider');
    if(sl){
      sl.querySelectorAll('.slide-img').forEach(function(im){
        function chk(){
          if(!im.naturalWidth) return;
          var por = im.naturalHeight > im.naturalWidth * 1.05;
          PORTRAIT[im.getAttribute('src')] = por;
          if(im.parentNode) im.parentNode.classList.toggle('split', por);
        }
        if(im.complete) chk(); else im.addEventListener('load', chk);
      });
      sl.querySelectorAll('[data-slide]').forEach(function(b){ b.onclick = function(){ slideGo(slideIdx + parseInt(b.dataset.slide, 10)); }; });
      sl.querySelectorAll('[data-slide-to]').forEach(function(b){ b.onclick = function(){ slideGo(parseInt(b.dataset.slideTo, 10)); }; });
      sl.addEventListener('mouseenter', function(){ slidePaused = true; });
      sl.addEventListener('mouseleave', function(){ slidePaused = false; });
      var tx = null;
      sl.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; slidePaused = true; }, {passive:true});
      sl.addEventListener('touchend', function(e){
        if(tx !== null){ var dx = e.changedTouches[0].clientX - tx; if(Math.abs(dx) > 40) slideGo(slideIdx + (dx < 0 ? 1 : -1)); }
        tx = null; setTimeout(function(){ slidePaused = false; }, 6000);
      });
    }
    var cmForm = document.getElementById('cm-form');
    if(cmForm){
      document.getElementById('cm-name').addEventListener('input', function(e){ cmName = e.target.value; });
      document.getElementById('cm-text').addEventListener('input', function(e){ cmText = e.target.value; var c = document.getElementById('cm-count'); if(c) c.textContent = cmText.length + '/300'; });
      cmForm.addEventListener('submit', function(e){ e.preventDefault(); submitComment(); });
    }
    var hdCart = document.getElementById('hd-cart');
    if(hdCart) hdCart.onclick = openCartSheet;
    var retry = document.getElementById('btn-retry');
    if(retry) retry.onclick = function(){ loadStatus = 'loading'; render(); loadProducts().then(render); };
    var searchInput = document.getElementById('search-input');
    if(searchInput){
      searchInput.addEventListener('input', function(){
        searchQuery = searchInput.value;
        clearTimeout(missTimer); missTimer = setTimeout(checkMiss, 1500);
        if(view !== 'home'){ view = 'home'; try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} }
        var pos = searchInput.selectionStart;
        render();
        var el = document.getElementById('search-input');
        if(el){ el.focus(); try{ el.setSelectionRange(pos, pos); }catch(e){} }
      });
    }
    document.querySelectorAll('[data-action="buy"]').forEach(function(b){
      b.onclick = function(){ setQty(b.dataset.id, 1); render(); };
    });
    document.querySelectorAll('[data-action="qty-plus"]').forEach(function(b){
      b.onclick = function(){ setQty(b.dataset.id, (cart[b.dataset.id]||0) + 1); render(); };
    });
    document.querySelectorAll('[data-action="qty-minus"]').forEach(function(b){
      b.onclick = function(){ setQty(b.dataset.id, (cart[b.dataset.id]||0) - 1); render(); };
    });
    var cartBtn = document.getElementById('btn-cart');
    if(cartBtn) cartBtn.onclick = openCartSheet;
    document.querySelectorAll('.cm-star').forEach(function(b){
      b.onclick = function(){
        cmStars = parseInt(b.dataset.s, 10);
        document.querySelectorAll('.cm-star').forEach(function(x, k){ x.firstChild.classList.toggle('on', k < cmStars); });
      };
    });
    var rqForm = document.getElementById('rq-form');
    if(rqForm){
      document.getElementById('rq-item').addEventListener('input', function(e){ reqItem = e.target.value; });
      document.getElementById('rq-note').addEventListener('input', function(e){ reqNote = e.target.value; });
      document.getElementById('rq-name').addEventListener('input', function(e){ reqName = e.target.value; });
      rqForm.addEventListener('submit', function(e){ e.preventDefault(); submitRequest(); });
    }
  }

  function checkMiss(){
    var q = searchQuery.trim().toLowerCase();
    if(q.length < 3 || loadStatus !== 'ok' || missLogged[q]) return;
    var found = STATE.products.some(function(p){ return (p.name||'').toLowerCase().indexOf(q) !== -1 || (p.description||'').toLowerCase().indexOf(q) !== -1; });
    if(found) return;
    missLogged[q] = 1;
    rpc('log_search_miss', {p_term:q}).catch(function(){});
  }

  /* ====== KERANJANG (lembar) ====== */
  function openCartSheet(){
    var ov = document.createElement('div');
    ov.className = 'overlay';
    document.body.appendChild(ov);
    function close(){ if(ov.parentNode) ov.parentNode.removeChild(ov); }
    function paint(){
      if(cartCount() === 0){
        ov.innerHTML = '<div class="sheet"><h2>Keranjang</h2><div class="ct-empty">Keranjang masih kosong.<br>Ketuk Keranjang pada barang untuk menambahkannya.</div><div class="sheet-actions"><button class="primary" id="ct-close">Tutup</button></div></div>';
        ov.querySelector('#ct-close').onclick = close;
        return;
      }
      var rows = Object.keys(cart).map(function(id){
        var p = STATE.products.find(function(x){ return x.id === id; });
        if(!p) return '';
        return '<div class="ct-row"><div class="ct-name">'+escapeHtml(p.name)+'<small>'+formatRupiah(p.price)+(p.noOrder ? ' · hanya hitungan' : '')+'</small></div>' +
          '<div class="ct-qty"><button class="qty-btn" data-ct="minus" data-id="'+id+'" aria-label="Kurangi">−</button><span class="qty-num">'+cart[id]+'</span><button class="qty-btn" data-ct="plus" data-id="'+id+'" aria-label="Tambah">+</button></div>' +
          '<div class="ct-sub">'+formatRupiah(p.price * cart[id])+'</div><button class="ct-del" data-ct="del" data-id="'+id+'">Hapus</button></div>';
      }).join('');
      ov.innerHTML = '<div class="sheet"><h2>Keranjang</h2><div>'+rows+'</div>' +
        '<div class="ct-sum"><div class="calc-line calc-total"><span>Total</span><span>'+formatRupiah(cartTotal())+'</span></div>' +
        (cartHasRokok() ? '<p class="hint rokok-flag">Rokok dihitung tetapi tidak ikut pesanan.</p>' : '') +
        '<label>Uang dibayar (Rp, boleh kosong)<input type="number" min="0" inputmode="numeric" id="ct-bayar" placeholder="0" value="'+escapeHtml(bayarState)+'"></label>' +
        '<div class="cart-kembali" id="ct-kembali">'+kembaliText()+'</div></div>' +
        '<p class="ct-saved">Keranjang tersimpan di perangkat ini.</p>' +
        '<div class="sheet-actions"><button class="ghost" id="ct-clear">Kosongkan</button><button class="ghost" id="ct-close">Lanjut belanja</button><button class="primary" id="ct-order">Pesan</button></div></div>';
      ov.querySelector('#ct-close').onclick = close;
      ov.querySelectorAll('[data-ct]').forEach(function(b){
        b.onclick = function(){
          var id = b.dataset.id, a = b.dataset.ct;
          if(a === 'plus') setQty(id, (cart[id]||0) + 1);
          else if(a === 'minus') setQty(id, (cart[id]||0) - 1);
          else setQty(id, 0);
          render(); paint();
        };
      });
      ov.querySelector('#ct-bayar').addEventListener('input', function(e){
        bayarState = e.target.value; saveCart();
        ov.querySelector('#ct-kembali').textContent = kembaliText();
      });
      ov.querySelector('#ct-clear').onclick = function(){
        askConfirm('Kosongkan semua barang di keranjang?', function(){ cart = {}; bayarState = ''; render(); paint(); }, 'Kosongkan', true);
      };
      ov.querySelector('#ct-order').onclick = function(){ close(); openOrderModal(parseInt(bayarState || '0', 10) || 0); };
    }
    ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
    paint();
  }

  /* ====== MODAL ====== */
  function openQrisModal(){
    if(!STATE.qris) return;
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML =
      '<div class="sheet">' +
        '<h2>Bayar via QRIS</h2>' +
        '<div class="preview"><img src="'+escapeHtml(STATE.qris)+'" alt="QRIS"></div>' +
        '<p class="hint">Pindai kode ini untuk membayar ke '+escapeHtml(STATE.shopName)+'.</p>' +
        '<div class="sheet-actions"><button class="primary" id="f-close">Tutup</button></div>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#f-close').onclick = function(){ overlay.remove(); };
  }

  function openOrderModal(bayar){
    var items = [], total = 0, rokokTotal = 0, rokokCount = 0;
    for(var id in cart){
      var p = STATE.products.find(function(x){ return x.id === id; });
      if(!p) continue;
      var sub = (p.price||0) * cart[id];
      if(p.noOrder){ rokokTotal += sub; rokokCount += cart[id]; continue; }
      total += sub;
      items.push({name:p.name, qty:cart[id], price:p.price, sub:sub});
    }
    if(!items.length){
      showNote('Daftar belanja hanya berisi rokok. Rokok tidak bisa dipesan lewat situs; hitung dan beli langsung di kios.');
      return;
    }
    var code = generateOrderCode();
    var rowsHtml = items.map(function(it){
      return '<div class="calc-row"><span class="calc-name">'+escapeHtml(it.name)+' x'+it.qty+'</span><span class="calc-price">'+formatRupiah(it.sub)+'</span></div>';
    }).join('');
    var rokokNote = rokokCount ? '<p class="hint">Rokok ('+rokokCount+' barang, '+formatRupiah(rokokTotal)+') tidak ikut pesanan. Dihitung dan dibeli langsung di kios.</p>' : '';

    function waTextFor(pay){
      var lines = [];
      lines.push('Pesan dari ' + STATE.shopName + ' (kode: ' + code + ')');
      items.forEach(function(it){ lines.push('- ' + it.name + ' x' + it.qty + ' = ' + formatRupiah(it.sub)); });
      lines.push('Total: ' + formatRupiah(total));
      lines.push('Pembayaran: ' + (pay === 'qris' ? 'QRIS (bukti bayar menyusul)' : 'Tunai di kios'));
      if(pay !== 'qris' && bayar > 0){ lines.push('Uang tunai disiapkan: ' + formatRupiah(bayar)); }
      return encodeURIComponent(lines.join('\n'));
    }

    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML =
      '<div class="sheet">' +
        '<h2>Kode Pesanan: ' + code + '</h2>' +
        '<div>' + rowsHtml + '</div>' +
        '<div class="calc-summary"><div class="calc-line calc-total"><span>Total pesanan</span><span>'+formatRupiah(total)+'</span></div></div>' +
        rokokNote +
        '<div class="pay-title">Pembayaran</div>' +
        '<label class="check"><input type="radio" name="pay" value="tunai" checked> Tunai di kios</label>' +
        (STATE.qris ? '<label class="check"><input type="radio" name="pay" value="qris"> QRIS</label>' : '') +
        '<p class="hint">Untuk mengirim pesanan, masukkan <b>kode persetujuan dari admin</b> (minta ke pemilik kios).</p>' +
        '<label class="code-label">Kode persetujuan admin<input id="order-code" type="password" inputmode="numeric" autocomplete="off" placeholder="Masukkan kode"></label>' +
        '<div class="code-err" id="order-err"></div>' +
        '<div class="sheet-actions" id="order-actions"><button class="primary" id="order-wa">Verifikasi &amp; lanjut</button></div>' +
        '<div class="sheet-actions"><button class="ghost" id="order-close">Tutup</button></div>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#order-close').onclick = function(){ overlay.remove(); };

    // Kode dicek di server (Supabase). Nomor WhatsApp baru dikirim balik kalau kodenya benar.
    function verify(){
      var input = overlay.querySelector('#order-code'), err = overlay.querySelector('#order-err'), btn = overlay.querySelector('#order-wa');
      var val = input.value.trim();
      if(!val){ err.textContent = 'Masukkan kode dari admin.'; return; }
      btn.disabled = true; btn.textContent = 'Memeriksa…'; err.textContent = '';
      fetch(SUPABASE_URL + '/rest/v1/rpc/verify_order_code', {
        method:'POST',
        headers:{apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY, 'Content-Type':'application/json'},
        body:JSON.stringify({p_code: val})
      }).then(function(res){ if(!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
        .then(function(wa){
          btn.disabled = false; btn.textContent = 'Verifikasi & lanjut';
          if(!wa){ err.textContent = 'Kode salah. Minta kode yang benar ke admin.'; input.select(); return; }
          var payEl = overlay.querySelector('input[name=pay]:checked');
          var pay = payEl ? payEl.value : 'tunai';
          var link = 'https://wa.me/' + encodeURIComponent(String(wa)) + '?text=' + waTextFor(pay);
          var qrisHtml = (pay === 'qris' && STATE.qris)
            ? '<div class="qris-box"><p class="hint">1. Bayar <b>' + formatRupiah(total) + '</b> lewat QRIS di bawah (isi nominal sesuai total).<br>2. Ketuk tombol WhatsApp, lalu kirim bukti bayarnya.</p><img src="' + escapeHtml(STATE.qris) + '" alt="QRIS"></div>'
            : '';
          overlay.querySelector('#order-actions').outerHTML = qrisHtml + '<div class="sheet-actions" id="order-actions"><a class="wa-open" id="order-open" href="' + escapeHtml(link) + '" target="_blank" rel="noopener">Kode benar — Buka WhatsApp</a></div>';
          input.disabled = true;
          overlay.querySelectorAll('input[name=pay]').forEach(function(r){ r.disabled = true; });
          overlay.querySelector('#order-open').onclick = function(){
            setTimeout(function(){ cart = {}; bayarState = ''; overlay.remove(); render(); }, 400);
          };
        })
        .catch(function(){
          btn.disabled = false; btn.textContent = 'Verifikasi & lanjut';
          err.textContent = 'Tidak bisa memeriksa kode. Periksa internet lalu coba lagi.';
        });
    }
    overlay.querySelector('#order-wa').onclick = verify;
    overlay.querySelector('#order-code').addEventListener('keydown', function(e){ if(e.key === 'Enter') verify(); });
  }

  // Kalkulator memakai keranjang yang sama dengan tombol Beli (selalu sinkron)
  function openCalcModal(){
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    var rowsHtml = STATE.products.filter(function(p){ return !p.soldOut; }).map(function(p){
      return '<div class="calc-row">' +
        '<span class="calc-name">'+escapeHtml(p.name)+' <span class="calc-price">('+formatRupiah(p.price)+')</span></span>' +
        '<input type="number" min="0" inputmode="numeric" value="'+(cart[p.id]||0)+'" data-calc-id="'+p.id+'">' +
      '</div>';
    }).join('');
    overlay.innerHTML =
      '<div class="sheet">' +
        '<h2>Hitung Belanja</h2>' +
        '<div id="calc-list">' + rowsHtml + '</div>' +
        '<div class="calc-summary">' +
          '<div class="calc-line"><span>Total belanja</span><span class="calc-total" id="calc-total">Rp 0</span></div>' +
          '<label>Uang dibayar (Rp)<input type="number" min="0" inputmode="numeric" id="calc-bayar" placeholder="0" value="'+escapeHtml(bayarState)+'"></label>' +
          '<div class="calc-line"><span>Kembalian</span><span id="calc-kembali">Rp 0</span></div>' +
        '</div>' +
        '<div class="sheet-actions"><button class="ghost" id="calc-reset">Reset</button><button class="primary" id="calc-close">Tutup</button></div>' +
      '</div>';
    document.body.appendChild(overlay);

    function recalc(){
      var total = cartTotal();
      overlay.querySelector('#calc-total').textContent = formatRupiah(total);
      var bayar = parseInt(overlay.querySelector('#calc-bayar').value || '0', 10) || 0;
      var kembali = bayar - total;
      var el = overlay.querySelector('#calc-kembali');
      el.className = kembali < 0 ? 'calc-kembali negatif' : 'calc-kembali positif';
      el.textContent = (kembali < 0 && bayar > 0) ? 'Kurang ' + formatRupiah(Math.abs(kembali)) : formatRupiah(Math.max(0, kembali));
    }
    overlay.querySelectorAll('[data-calc-id]').forEach(function(inp){
      inp.addEventListener('input', function(){ setQty(inp.dataset.calcId, inp.value); recalc(); render(); });
    });
    overlay.querySelector('#calc-bayar').addEventListener('input', function(e){
      bayarState = e.target.value;
      recalc();
      var el = document.getElementById('cart-kembali'); if(el) el.textContent = kembaliText();
